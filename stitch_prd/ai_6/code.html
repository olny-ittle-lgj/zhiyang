<body class="flex flex-col min-h-screen">
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 bg-deep-charcoal/60 backdrop-blur-xl border-b border-outline-variant/20 shadow-none transition-all duration-300 ease-in-out">
<div class="flex justify-between items-center max-w-container-max mx-auto px-margin-lg h-20">
<div class="font-headline-md text-headline-md font-bold text-on-surface tracking-tighter">
                ZhiYan AI
            </div>
<div class="hidden md:flex items-center space-x-8">
<a class="font-headline-md text-headline-md text-on-surface-variant hover:text-electric-blue transition-colors" href="#">Evolution</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:text-electric-blue transition-colors" href="#">Workspace</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:text-electric-blue transition-colors" href="#">Lab</a>
</div>
<div class="flex items-center">
<button class="bg-electric-blue text-deep-charcoal font-bold px-6 py-2 rounded-lg hover:bg-mint-evolution transition-all">Sign In</button>
</div>
</div>
</nav>
<!-- Main Content: Login Shell -->
<main class="flex-grow flex items-center justify-center relative overflow-hidden pt-20">
<!-- Background Animation -->

<!-- Decorative subtle glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-electric-blue/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-md px-4 py-margin-lg">
<div class="glass-card rounded-xl p-10 flex flex-col items-center">
<div class="mb-8 text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">欢迎回来</h1>
<p class="font-body-md text-body-md text-on-surface-variant">登录以继续您的知识演化</p>
</div>
<form class="w-full space-y-6">
<!-- Username/Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-outline px-1">账号/邮箱</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-electric-blue transition-colors">mail</span>
<input class="w-full bg-deep-charcoal border border-outline-variant/50 focus:border-electric-blue focus:ring-0 text-on-surface font-body-md rounded-lg py-3 pl-12 pr-4 transition-all outline-none" placeholder="name@example.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-outline">密码</label>
<a class="font-label-sm text-label-sm text-electric-blue hover:text-mint-evolution transition-colors" href="#">忘记密码？</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-electric-blue transition-colors">lock</span>
<input class="w-full bg-deep-charcoal border border-outline-variant/50 focus:border-electric-blue focus:ring-0 text-on-surface font-body-md rounded-lg py-3 pl-12 pr-12 transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Login Button -->
<button class="w-full bg-electric-blue text-deep-charcoal font-bold py-4 rounded-lg text-headline-md glow-on-hover hover:bg-mint-evolution transition-all transform active:scale-[0.98] mt-4" type="submit">
                        登录
                    </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        还没有账号？ <a class="text-electric-blue font-bold hover:underline" href="#">立即注册</a>
</p>
</div>
<!-- Third Party Login -->
<div class="w-full mt-10">
<div class="flex items-center w-full mb-6">
<div class="flex-grow h-px bg-outline-variant/30"></div>
<span class="mx-4 font-label-sm text-label-sm text-outline uppercase tracking-widest">其他登录方式</span>
<div class="flex-grow h-px bg-outline-variant/30"></div>
</div>
<div class="flex justify-center gap-6">
<!-- WeChat icon represented by a custom button with material symbol -->
<button class="w-12 h-12 rounded-full border border-outline-variant/50 flex items-center justify-center hover:border-electric-blue hover:bg-surface-variant/30 transition-all group" title="微信登录">
<span class="material-symbols-outlined text-outline group-hover:text-electric-blue" style="font-variation-settings: 'FILL' 1;">chat</span>
</button>
<!-- Mobile/SMS icon -->
<button class="w-12 h-12 rounded-full border border-outline-variant/50 flex items-center justify-center hover:border-electric-blue hover:bg-surface-variant/30 transition-all group" title="手机验证码登录">
<span class="material-symbols-outlined text-outline group-hover:text-electric-blue">phone_iphone</span>
</button>
<!-- Other icon for demo -->
<button class="w-12 h-12 rounded-full border border-outline-variant/50 flex items-center justify-center hover:border-electric-blue hover:bg-surface-variant/30 transition-all group" title="更多方式">
<span class="material-symbols-outlined text-outline group-hover:text-electric-blue">more_horiz</span>
</button>
</div>
</div>
</div>
</div>

<a class="font-label-md text-label-md text-outline hover:text-mint-evolution transition-colors" href="#">API Docs</a>
</div>
</div>

<!-- Simple interaction script for input focus -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-1', 'ring-electric-blue/30');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-1', 'ring-electric-blue/30');
            });
        });

        // Toggle password visibility placeholder logic
        const togglePass = document.querySelector('button span[data-icon="visibility"]');
        if(togglePass) {
            togglePass.addEventListener('click', function() {
                const input = this.closest('.relative').querySelector('input');
                if(input.type === 'password') {
                    input.type = 'text';
                    this.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    this.textContent = 'visibility';
                }
            });
        }
    </script>
</body></html>
